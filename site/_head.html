<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="Gravit Path">
<meta property="og:image" content="https://www.gravit.space/assets/img/og.webp">
<link rel="icon" type="image/png" sizes="512x512" href="https://gravit.space/android-chrome-512x512.png">
<link rel="stylesheet" href="{{ROOT}}css/site.css">
<link rel="stylesheet" href="{{ROOT}}css/theme.css">
<script src="{{ROOT}}css/theme.js"></script>
<style>
.gv{--card:rgba(4,16,38,.72);--line:rgba(100,180,255,.18);--muted:rgba(200,225,255,.66);--glow:#00aaff;--glow-soft:rgba(0,170,255,.12);
--ok:#5eead4;--warn:#fcd34d;--bad:#fca5a5;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
width:100%;max-width:1136px;font-size:17px;line-height:1.6;color:var(--text)}
.gv a{color:var(--glow);text-underline-offset:3px}
.gv h1,.gv h2,.gv h3{font-weight:700}
.gv ul{padding-left:18px}
.gv section:first-of-type{border-top:0}
.gv a{color:var(--glow);text-underline-offset:3px}
.gv .hero{padding:72px 0 56px;display:grid;grid-template-columns:1.2fr .9fr;gap:40px;align-items:center}
@media(max-width:860px){.gv .hero{grid-template-columns:1fr;padding-top:44px}}
.gv .kicker{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--glow);margin:0 0 14px}
.gv h1{font-size:clamp(34px,5.6vw,56px);line-height:1.06;letter-spacing:-.025em;margin:0 0 20px}
.gv h1 em{font-style:normal;color:var(--glow)}
.gv .lead{font-size:19px;color:var(--muted);margin:0 0 26px;max-width:600px}
.gv .btns{display:flex;gap:12px;flex-wrap:wrap}
.gv .btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:650;font-size:15px;text-decoration:none}
.gv .btn1{background:var(--glow);color:#00122a}
.gv .btn1:hover{background:#4cc6ff}
.gv .btn2{border:1.5px solid var(--line);color:var(--text)}
.gv .btn2:hover{border-color:var(--glow)}
.gv .states{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 0 60px var(--glow-soft)}
.gv .state{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.gv .state:last-of-type{border-bottom:0}
.gv .state b{font-weight:650}
.gv .tag{font:700 11.5px var(--mono);padding:4px 10px;border-radius:999px;white-space:nowrap}
.gv .t-ok{background:rgba(94,234,212,.14);color:var(--ok)}
.gv .t-warn{background:rgba(252,211,77,.14);color:var(--warn)}
.gv .t-bad{background:rgba(252,165,165,.14);color:var(--bad)}
.gv .t-plan{background:rgba(0,170,255,.14);color:var(--glow)}
.gv .states p{margin:10px 4px 0;font-size:13.5px;color:var(--muted)}
.gv section{padding:56px 0;border-top:1px solid var(--line)}
.gv h2{font-size:clamp(26px,3.6vw,36px);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px}
.gv h3{font-size:18px;margin:0 0 8px}
.gv p{margin:0 0 14px}
.gv .muted{color:var(--muted)}
.gv .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
@media(max-width:860px){.gv .grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.gv .grid{grid-template-columns:1fr}}
.gv .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.gv .card p{color:var(--muted);font-size:15px;margin:0}
.gv .card .rule{font:600 12px var(--mono);color:var(--glow);display:block;margin-bottom:6px}
.gv pre{background:#000a18;border:1px solid var(--line);color:#cfe9ff;border-radius:14px;padding:14px 16px;overflow-x:auto;font:13.5px/1.55 var(--mono);margin:0 0 14px}
.gv code{font-family:var(--mono);font-size:.9em}
.gv table{width:100%;border-collapse:collapse;font-size:15px}
.gv th,.gv td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.gv th{color:var(--muted);font-weight:600;font-size:13px}
.gv .tablewrap{overflow-x:auto}
.gv .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
@media(max-width:860px){.gv .plans{grid-template-columns:1fr}}
.gv .plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative}
.gv .plan .price{font-size:34px;font-weight:750;letter-spacing:-.02em;margin:6px 0 2px}
.gv .plan .price small{font-size:15px;color:var(--muted);font-weight:400}
.gv .plan ul{margin:14px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.gv .plan li{margin:5px 0}
.gv .plan .tag{position:absolute;top:18px;right:18px}
.gv .notice{border-left:4px solid var(--warn);background:rgba(252,211,77,.07);padding:14px 18px;border-radius:10px;margin:18px 0 0}
.gv .correction{border-left:4px solid var(--glow);background:var(--glow-soft);padding:14px 18px;border-radius:10px;margin:14px 0}
.gv .wl{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;max-width:760px;margin-top:8px}
.gv .wl-field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.gv .wl input[type=email],.gv .wl select{background:rgba(0,10,24,.8);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
.gv .wl input:focus,.gv .wl select:focus{outline:2px solid var(--glow);outline-offset:1px}
.gv .wl-consent{grid-column:1/-1;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.gv .wl-consent input{margin-top:4px}
.gv .wl button{grid-column:1/-1;justify-self:start;border:0;cursor:pointer;font:inherit;font-weight:650}
.gv .wl-hp{position:absolute;left:-9999px}
.gv .wl-ok{color:var(--ok);font-weight:600}.gv .wl-err{color:var(--bad);font-weight:600}
@media(max-width:640px){.gv .wl{grid-template-columns:1fr}}

nav li{white-space:nowrap}
.gv .agora-line{font-size:var(--word-size,19.4px);line-height:1.5;font-weight:600;color:#fff;max-width:820px;margin:26px 0 0}
.gv .agora-line a{color:var(--glow);text-decoration:none}.gv .agora-line a:hover{text-decoration:underline}
.gv .agora-line em{font-style:normal;color:var(--glow)}

/* ─── GRAVIT FAMILY (same strip on every Gravit site) ─── */
.family { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 20px; margin: 0 0 18px;
  font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.family a { color: var(--muted); text-decoration: none; }
.family a:hover, .family a[aria-current] { color: #fff; }
.family-label { color: #4fc3f7; }
</style>
</head>
<body>
<!-- Orbital background -->
<div class="orbital-bg" aria-hidden="true">
  <svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="cg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1a90ff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#0040a0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- glow center -->
    <ellipse cx="450" cy="450" rx="90" ry="90" fill="url(#cg)" opacity="0.5"/>
    <!-- orbital petals, 18 ellipses rotated -->
    <g stroke="#3a9fff" stroke-width="0.8" fill="none" opacity="0.7">
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(0   450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(20  450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(40  450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(60  450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(80  450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(100 450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(120 450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(140 450 450)"/>
      <ellipse cx="450" cy="450" rx="60" ry="220" transform="rotate(160 450 450)"/>
    </g>
    <!-- spark dots -->
    <g fill="#5bc8ff" opacity="0.85">
      <circle cx="450" cy="230" r="2.5"/>
      <circle cx="450" cy="670" r="2.5"/>
      <circle cx="230" cy="450" r="2.5"/>
      <circle cx="670" cy="450" r="2.5"/>
      <circle cx="640" cy="260" r="2"/>
      <circle cx="260" cy="640" r="2"/>
      <circle cx="640" cy="640" r="2"/>
      <circle cx="260" cy="260" r="2"/>
      <circle cx="548" cy="236" r="1.5"/>
      <circle cx="352" cy="664" r="1.5"/>
      <circle cx="664" cy="548" r="1.5"/>
      <circle cx="236" cy="352" r="1.5"/>
      <circle cx="330" cy="248" r="1.5"/>
      <circle cx="570" cy="652" r="1.5"/>
    </g>
  </svg>
</div>
